<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple RAG Agent</title>
</head>
<body>
<h1>Simple RAG Agent</h1>
<form method="post" action="{{ url_for('index') }}">
    <label for="input_text">Input Text:</label><br/>
    <textarea id="input_text" name="input_text" rows="10" cols="200" required></textarea><br/><br/>
    <input type="submit" value="Run Script">
</form>
<br/>
<label for="output_field">Output:</label><br/>
<textarea id="output_field" name="output_field" readonly rows="38" cols="200">{{ output }}</textarea>
</body>
</html>
